<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bike Doctor</title>
  <desc id="desc">Bike Doctor service logo for social sharing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ff8a38"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="210" fill="#ff6a00" opacity="0.13"/>
  <g transform="translate(120 135)">
    <rect x="0" y="0" width="132" height="132" rx="28" fill="url(#accent)"/>
    <text x="66" y="82" font-size="78" text-anchor="middle" fill="#0b0b0b" font-family="Arial, sans-serif">🏍</text>
    <text x="190" y="82" font-size="72" font-weight="900" fill="#f5f5f5" font-family="Arial, sans-serif">BIKE</text>
    <text x="190" y="150" font-size="72" font-weight="900" fill="#ff6a00" font-family="Arial, sans-serif">DOCTOR</text>
    <text x="190" y="220" font-size="34" fill="#d2d2d2" font-family="Arial, sans-serif">Your Bike. Our Care.</text>
  </g>
</svg>
